<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Forum saumurois — carte citoyenne des signalements">
  <title>Forum saumurois</title>
</head>
<body>
  <p>Chargement du Forum saumurois…</p>
  <script>
    fetch('/public/index.html', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Impossible de charger l’application');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.body.innerHTML = '<p>Le site n’a pas pu être chargé. Veuillez réessayer.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
